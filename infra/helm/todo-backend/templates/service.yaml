apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  labels:
    {{- include "todo-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "todo-backend.selectorLabels" . | nindent 4 }}
