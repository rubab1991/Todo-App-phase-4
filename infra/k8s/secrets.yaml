---
# Redpanda (Kafka) credentials — values are base64-encoded
# To apply: kubectl apply -f secrets.yaml
# Generate base64: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: redpanda-secrets
  namespace: todo
type: Opaque
data:
  # echo -n "d6m3hgvjkk1fce8gkpfg.any.us-east-1.mpx.prd.cloud.redpanda.com:9092" | base64
  REDPANDA_BROKERS: ZDZtM2hndmprazFmY2U4Z2twZmcuYW55LnVzLWVhc3QtMS5tcHgucHJkLmNsb3VkLnJlZHBhbmRhLmNvbTo5MDky
  # echo -n "red-panda" | base64
  REDPANDA_USERNAME: cmVkLXBhbmRh
  # echo -n "co14fIOGrGltFe5wHSyH4ksaS16bpD" | base64
  REDPANDA_PASSWORD: Y28xNGZJT0dyR2x0RmU1d0hTeUg0a3NhUzE2YnBE

---
# Render API key
apiVersion: v1
kind: Secret
metadata:
  name: render-secrets
  namespace: todo
type: Opaque
data:
  # echo -n "rnd_70sskOXQEzkPKGGUL4mx9IlQrXc6" | base64
  RENDER_API_KEY: cm5kXzcwc3NrT1hRRXprUEtHR1VMNm14OUlsUXJYYzY=

---
# Redis state-store password (set to empty string for no-auth dev setup)
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: todo
type: Opaque
data:
  # echo -n "" | base64 → empty
  REDIS_PASSWORD: ""
