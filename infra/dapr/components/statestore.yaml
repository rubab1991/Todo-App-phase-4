apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: todo
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.todo.svc.cluster.local:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis-secrets
        key: REDIS_PASSWORD
    - name: actorStateStore
      value: "true"
    - name: keyPrefix
      value: "todo"
auth:
  secretStore: kubernetes
