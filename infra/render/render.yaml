services:
  - type: web
    name: todo-backend
    env: python
    region: oregon
    plan: starter
    repo: https://github.com/rubab-bukhari/todo-app
    branch: 001-event-driven-chatbot
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NEON_DB_URL
        sync: false   # Set in Render dashboard
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: DAPR_HTTP_PORT
        value: "3500"
      - key: DAPR_APP_ID
        value: "todo-backend"
      - key: PYTHON_VERSION
        value: "3.11.0"
