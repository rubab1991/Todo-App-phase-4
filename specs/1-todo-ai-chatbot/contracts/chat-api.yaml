openapi: 3.0.3
info:
  title: Todo AI Chatbot API
  description: API for the AI-powered Todo Chatbot that allows users to manage tasks via natural language
  version: 1.0.0
servers:
  - url: https://api.todo-ai-chatbot.com/v1
    description: Production server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  /{user_id}/chat:
    post:
      summary: Send a message to the AI chatbot
      description: Processes a natural language message from the user and returns an appropriate response with any task operations performed
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The user's message in natural language
                  example: "Add task: Buy groceries"
                conversation_id:
                  type: string
                  description: Optional conversation ID to continue a specific conversation
                  example: "abc123-def456"
              required:
                - message
      responses:
        '200':
          description: Successful response from the AI chatbot
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The AI-generated response
                    example: "Task 'Buy groceries' has been added successfully."
                  conversation_id:
                    type: string
                    description: The conversation ID for continuity
                    example: "abc123-def456"
                  tool_calls:
                    type: array
                    items:
                      type: object
                      properties:
                        tool_name:
                          type: string
                          description: The name of the tool called
                          example: "add_task"
                        parameters:
                          type: object
                          description: Parameters passed to the tool
                        result:
                          type: object
                          description: Result from the tool execution
                  task_operations:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskOperation'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - User does not have access to this resource
        '500':
          description: Internal server error

  /users/{user_id}/tasks:
    get:
      summary: Get user's tasks
      description: Retrieve all tasks for the specified user
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
        - name: status
          in: query
          description: Filter tasks by status
          schema:
            type: string
            enum: [all, pending, completed]
            default: all
      responses:
        '200':
          description: Successfully retrieved tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - User does not have access to this resource
        '500':
          description: Internal server error

    post:
      summary: Create a new task
      description: Create a new task for the user
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - User does not have access to this resource
        '500':
          description: Internal server error

  /users/{user_id}/tasks/{task_id}:
    put:
      summary: Update a task
      description: Update the title or description of an existing task
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          description: The ID of the task to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - User does not have access to this resource
        '404':
          description: Task not found
        '500':
          description: Internal server error

    delete:
      summary: Delete a task
      description: Delete an existing task
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          description: The ID of the task to delete
          schema:
            type: integer
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTaskResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - User does not have access to this resource
        '404':
          description: Task not found
        '500':
          description: Internal server error

    patch:
      summary: Complete a task
      description: Mark a task as completed
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          description: The ID of the task to complete
          schema:
            type: integer
      responses:
        '200':
          description: Task completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - User does not have access to this resource
        '404':
          description: Task not found
        '500':
          description: Internal server error

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the task
          example: 1
        user_id:
          type: string
          description: ID of the user who owns the task
          example: "user123"
        title:
          type: string
          description: Title of the task
          example: "Buy groceries"
        description:
          type: string
          description: Optional description of the task
          example: "Need to buy milk, bread, and eggs"
        status:
          type: string
          description: Current status of the task
          enum: [pending, completed]
          example: "pending"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: "2023-10-20T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
          example: "2023-10-20T10:00:00Z"
      required:
        - id
        - user_id
        - title
        - status
        - created_at
        - updated_at

    TaskOperation:
      type: object
      properties:
        operation:
          type: string
          enum: [create, update, complete, delete]
          description: The type of operation performed
          example: "create"
        task_id:
          type: integer
          description: The ID of the task affected
          example: 1
        status:
          type: string
          description: The result status of the operation
          example: "success"

    CreateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the task
          example: "Buy groceries"
        description:
          type: string
          description: Optional description of the task
          example: "Need to buy milk, bread, and eggs"
      required:
        - title

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: New title for the task (optional)
          example: "Buy weekly groceries"
        description:
          type: string
          description: New description for the task (optional)
          example: "Need to buy milk, bread, eggs, and fruits"
        status:
          type: string
          description: New status for the task (optional)
          enum: [pending, completed]
          example: "pending"

    DeleteTaskResponse:
      type: object
      properties:
        task_id:
          type: integer
          description: The ID of the deleted task
          example: 1
        status:
          type: string
          description: Confirmation of deletion
          example: "deleted"
        message:
          type: string
          description: Human-readable confirmation message
          example: "Task 'Buy groceries' has been deleted successfully"